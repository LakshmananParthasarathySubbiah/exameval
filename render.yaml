# Render.com blueprint (Infrastructure-as-Code, C3).
# Deploy the whole stack: `render blueprint launch` or connect the repo in Render.
# Managed Postgres + Redis are provisioned and wired automatically.
services:
  - type: web
    name: exameval-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate
    # migrate deploy runs at boot so schema changes apply on each release
    startCommand: npx prisma migrate deploy && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: exameval-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: exameval-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false # set in the Render dashboard (secret)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: redis
    name: exameval-redis
    plan: free
    ipAllowList: [] # only reachable from Render services

  - type: web
    name: exameval-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the deployed API URL + /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: exameval-db
    plan: free
    databaseName: exameval
